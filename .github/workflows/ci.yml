# Runs on every push: unit tests plus a dbt parse (no Snowflake connection needed).
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: dbt parse
        working-directory: dbt
        env:
          SNOWFLAKE_ACCOUNT: ci
          SNOWFLAKE_USER: ci
          SNOWFLAKE_PASSWORD: ci
        run: dbt parse --profiles-dir .
